# PEN-TEST: main website + CTFd arena running together.
#
# Lean setup: CTFd runs from the official prebuilt image, no vendored source.
#   cp .env.example .env        # set CTFD_URL to your public CTFd address
#   docker compose up --build
#
# Then open:
#   Main site : http://localhost:5000  (shortcuts: /play, /ctf, /arena, /challenges, /scoreboard)
#   CTFd arena: http://localhost:8000  (direct) or http://localhost:80 (via nginx)
#
# The main site links/redirects to $CTFD_URL. Inside the compose network the
# health check uses $CTFD_INTERNAL_URL (http://ctfd:8000).

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CTFD_URL=${CTFD_URL:-http://localhost:8000}
      - CTFD_INTERNAL_URL=${CTFD_INTERNAL_URL:-http://ctfd:8000}
      - SECRET_KEY=${SECRET_KEY:-}
      - HACKCLUB_CLIENT_ID=${HACKCLUB_CLIENT_ID:-}
      - HACKCLUB_CLIENT_SECRET=${HACKCLUB_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
    depends_on:
      - ctfd

  ctfd:
    image: ctfd/ctfd:latest
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - ctfd-logs:/var/log/CTFd
      - ctfd-uploads:/var/uploads
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - default
      - internal

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - ctfd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ctfd-mysql:/var/lib/mysql
    networks:
      - internal
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
      - ctfd-redis:/data
    networks:
      - internal

volumes:
  ctfd-logs:
  ctfd-uploads:
  ctfd-mysql:
  ctfd-redis:

networks:
  default:
  internal:
    internal: true
